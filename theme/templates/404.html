{% extends "base.html" %}

{% block title %}404 - Pagina non trovata{% endblock %}

{% block content %}
<section class="error-404">
    <div class="container">
        <header class="error-header">
            <h1>404</h1>
            <p>Pagina non trovata</p>
        </header>
        <div class="error-content">
            <h2>La pagina che stai cercando non esiste</h2>
            <p>Potrebbe essere stata rimossa o l'URL è sbagliato.</p>
            <a href="{{ SITEURL }}/" class="btn btn-primary">Torna alla home</a>
            <a href="{{ SITEURL }}/guide/" class="btn btn-secondary">Esplora le guide</a>
        </div>
    </div>
</section>
{% endblock %}
